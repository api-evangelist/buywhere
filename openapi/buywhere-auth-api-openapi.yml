openapi: 3.2.0
info:
  title: BuyWhere Product Catalog Auth API
  version: '1'
  description: Agent-native product catalog API for Southeast Asia and US commerce. Search 370M+ products across Shopee, Lazada, Amazon, Walmart, FairPrice, Carousell, and 20+ e-commerce platforms. Compare prices, discover deals, and find best prices through REST or MCP.
servers:
- url: https://api.buywhere.ai/v1
tags:
- name: Auth
paths:
  /auth/register:
    post:
      summary: Register an agent and receive an API key
      operationId: registerAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - agent_name
              properties:
                agent_name:
                  type: string
                  description: Name or identifier of your agent
                contact:
                  type: string
                  description: Contact email (optional)
                use_case:
                  type: string
                  description: Brief description of your use case
      responses:
        '201':
          description: API key issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
                  tier:
                    type: string
                  rate_limit:
                    type: object
                    properties:
                      rpm:
                        type: integer
                      daily:
                        type: integer
      tags:
      - Auth
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
x-provenance:
  method: harvested
  publisher: BuyWhere
  source: https://api.buywhere.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
