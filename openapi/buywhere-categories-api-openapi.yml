openapi: 3.2.0
info:
  title: BuyWhere Product Catalog Categories API
  version: '1'
  description: Agent-native product catalog API for Southeast Asia and US commerce. Search 370M+ products across Shopee, Lazada, Amazon, Walmart, FairPrice, Carousell, and 20+ e-commerce platforms. Compare prices, discover deals, and find best prices through REST or MCP.
servers:
- url: https://api.buywhere.ai/v1
tags:
- name: Categories
paths:
  /categories:
    get:
      summary: List top-level product categories
      operationId: listCategories
      security:
      - BearerAuth: []
      parameters:
      - name: currency
        in: query
        schema:
          type: string
          default: SGD
      responses:
        '200':
          description: Category list with slug, name, and product_count
      tags:
      - Categories
  /categories/{slug}:
    get:
      summary: Get products within a category
      operationId: getCategoryProducts
      security:
      - BearerAuth: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Category slug (from /categories)
      - name: currency
        in: query
        schema:
          type: string
          default: SGD
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Category detail with subcategories and products
        '404':
          description: Category not found
      tags:
      - Categories
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
x-provenance:
  method: harvested
  publisher: BuyWhere
  source: https://api.buywhere.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
