openapi: 3.2.0
info:
  title: BuyWhere Product Catalog Featured API
  version: '1'
  description: Agent-native product catalog API for Southeast Asia and US commerce. Search 370M+ products across Shopee, Lazada, Amazon, Walmart, FairPrice, Carousell, and 20+ e-commerce platforms. Compare prices, discover deals, and find best prices through REST or MCP.
servers:
- url: https://api.buywhere.ai/v1
tags:
- name: Featured
paths:
  /featured:
    get:
      summary: Get featured products (newest active products)
      operationId: getFeatured
      security:
      - BearerAuth: []
      description: 'Returns the most recently added active products, ordered by product ID descending. Alias: /v1/products/featured.'
      parameters:
      - name: country
        in: query
        schema:
          type: string
          enum:
          - SG
          - US
          - VN
          - TH
          - MY
        description: 'ISO country code filter (alias: country_code). Default: SG.'
      - name: country_code
        in: query
        schema:
          type: string
          enum:
          - SG
          - US
          - VN
          - TH
          - MY
        description: 'ISO country code filter. Default: SG.'
      - name: currency
        in: query
        schema:
          type: string
        description: Currency filter. Inferred from country_code if omitted.
      - name: limit
        in: query
        schema:
          type: integer
          default: 12
          maximum: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      - name: compact
        in: query
        schema:
          type: boolean
          default: false
        description: Return minimal payload for AI agents.
      responses:
        '200':
          description: Featured product list
        '401':
          description: Missing or invalid API key
      tags:
      - Featured
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
